name: krishichakra
description: KrishiChakra — Strengthening market linkages and price discovery for farmers (SIH PS 132).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.1

  # HTTP client
  dio: ^5.4.3+1

  # Local storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^1.2.0

  # Camera & image
  camera: ^0.12.1
  image_picker: ^1.1.2

  # QR code generation
  qr_flutter: ^4.1.0

  # Speech & TTS
  speech_to_text: ^7.5.0
  flutter_tts: ^4.0.2

  # UI helpers
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0
  lottie: ^3.1.2
  url_launcher: ^6.3.0
  intl: ^0.20.2

  # Connectivity
  connectivity_plus: ^7.3.1

  # Font
  google_fonts: ^8.2.1

  # Utils
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  logger: ^2.4.0
  envied: ^1.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  freezed: ^4.0.2
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.9
  envied_generator: ^1.3.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
